pre-commit:
  commands:
    check:
      run: pnpm check:fix {staged_files}
      glob: '*.{js,cjs,mjs,ts,cts,mts,json,jsonc,md,yaml,yml}'
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    check:
      run: pnpm check
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
